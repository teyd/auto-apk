# Pullfrog: AI pull request review. The Pullfrog app dispatches this workflow on
# main when a pull request opens or someone mentions @pullfrog. A pull request
# cannot change the workflow that reviews it. The Grok credential lives in
# Pullfrog's own store and is released only to an OIDC-verified run of this repo.
name: Pullfrog
run-name: ${{ inputs.name || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Agent prompt
      name:
        type: string
        description: Run name

permissions:
  contents: read

jobs:
  pullfrog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write # Pullfrog mints its own short-lived GitHub token and fetches stored credentials
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: pullfrog/pullfrog@0741f79ecebfa4469a010644d2aed2d96d32d489 # v0.1.127
        with:
          prompt: ${{ inputs.prompt }}
