# Build pipeline. plan -> build (one leg per app) -> report. publish (signing and
# the release) arrives with the keystore; until then this runs only on demand.
#
# Trust boundaries:
#   plan, build  contents: read only. build handles untrusted downloads and
#                third-party patch bundles, so it gets no secrets and no id-token.
#   report       issues: write and nothing else.
name: build

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Build even if unchanged: "all", or app ids separated by commas'
        required: false
        default: ""
        type: string
  # schedule: added together with the publish job.

permissions: {}

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: bun src/main.ts plan --force "$FORCE"

  build:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      - name: Tool versions
        id: tools
        run: |
          echo "java=$(jq -r .tools.morphe.java auto-apk.json)" >> "$GITHUB_OUTPUT"
          echo "morphe=$(jq -r .tools.morphe.sha256 auto-apk.json)" >> "$GITHUB_OUTPUT"
          # apksigner and aapt2 from the newest build-tools preinstalled on the runner
          find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1 >> "$GITHUB_PATH"

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ steps.tools.outputs.java }}

      # The jar's SHA-256 is checked on every use, so a bad cache entry is replaced, not run.
      - name: Cache the Morphe jar
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/cache/morphe
          key: morphe-${{ steps.tools.outputs.morphe }}

      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ matrix.app }}
        run: bun src/main.ts build --app "$APP"

      - name: Upload the build record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: record-${{ matrix.app }}
          path: out/${{ matrix.app }}/build.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the unsigned APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-${{ matrix.app }}
          path: out/${{ matrix.app }}/patched-unsigned.apk
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  report:
    needs: [plan, build]
    if: always() && needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: record-*
          path: records
      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
          APPS: ${{ needs.plan.outputs.apps }}
        run: bun src/main.ts report --records records --apps "$APPS"
